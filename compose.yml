services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: Prashant2932
      MYSQL_DATABASE: userdata
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d
    networks:
      - mern-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 10
      start_period: 30s

  backend-app:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: backend-app
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - mern-net
    env_file:
      - ./server/.env
    ports:
      - "5001:4200"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4200/health || exit 1"]
      interval: 10s
      retries: 5
      start_period: 15s
      timeout: 5s

  web-app:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: web-app
    networks:
      - mern-net
    depends_on:
      backend-app:
        condition: service_healthy
    ports:
      - "5000:3000"

volumes:
  mysql-data:

networks:
  mern-net:
    driver: bridge
