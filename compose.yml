
services:
  web-app:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "5000:3000"   # Host 5000 -> Container 3000
    networks:
      - mern-net
    depends_on:
      - backend-app

  backend-app:
    build:
      context: ./server
      dockerfile: Dockerfile
    env_file:
      - ./server/.env
    networks:
      - mern-net
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Prashant2932
      MYSQL_DATABASE: userdata
    volumes:
      - ./server/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - mern-net

networks:
  mern-net:
    driver: bridge
