services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: Prashant2932
      MYSQL_DATABASE: userdata
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql # <-- named volume for persistence
      - ./db/init:/docker-entrypoint-initdb.d # <-- init SQL scripts
    networks:
      - mern-net
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 5s
      retries: 10
      start_period: 10s

  backend-app:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: backend-app
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - mern-net
    env_file:
      - ./server/.env
    ports:
      - "5001:4200"
  web-app:
    build:
      context: ./client # adjust path if needed
      dockerfile: Dockerfile
    container_name: web-app
    depends_on:
      backend-app:
        condition: service_healthy
    networks:
      - mern-net
    ports:
      - "5000:3000" # Host 5000 -> Container 3000
    environment:

volumes:
  mysql-data:
networks:
  mern-net:
    # <-- network will be created automatically
    driver: bridge
